name: بناء نسخة تجريبية (APK)

# نسخة تجريبية للتثبيت على جوالك مباشرة. لا تحتاج مفتاحًا ولا أسرارًا.
# للنشر على APKPure استخدم سير العمل «بناء ملف APK» الموقّع.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: تثبيت الحزم وبناء الخطوط
        run: |
          npm install --no-audit --no-fund
          npm run fonts

      - name: توليد مشروع الأندرويد
        run: |
          npx cap add android
          VERSION_NAME="1.0.0-test" VERSION_CODE="${GITHUB_RUN_NUMBER}" python3 scripts/patch-android.py
          npx cap sync android

      - name: بناء النسخة التجريبية
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: تجهيز الملف
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Asma-Allah-Husna-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Asma-Allah-Husna-test-apk
          path: Asma-Allah-Husna-test.apk
